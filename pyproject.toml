[project]
name = "skill-forge"
version = "0.3.1"
description = "A Claude Code plugin that makes your skills and subagents self-improving."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "jsonschema>=4.20",
    "gitpython>=3.1",
    "pytest>=8.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
]
# Local-dev verification loop. Headless Chromium drives the live
# dashboard end-to-end. Not shipped to plugin users.
verify = [
    "playwright>=1.40,<2",
    "pytest-playwright>=0.5,<1",
]

[project.scripts]
forge = "skill_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not manual and not verify'"
markers = [
    "manual: tests requiring real subprocesses or browsers, excluded from default CI",
    "verify: real-browser dashboard verification loop (Playwright, headless Chromium)",
]
