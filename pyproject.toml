[project]
name = "skill-forge"
version = "0.3.2"
description = "A Claude Code plugin that makes your skills and subagents self-improving."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "jsonschema>=4.20",
    "gitpython>=3.1",
    "pytest>=8.0",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "jinja2>=3.1,<4",
    "httpx>=0.27,<1",
]

# Browser-driven verification loop. Heavy (Playwright pulls Chromium),
# only used when iterating on dashboard/ files.  Run:
#   uv sync --extra ui --extra ui-test
#   uv run playwright install chromium
#   uv run pytest tests/manual/test_dashboard_browser.py -m manual
ui-test = [
    "playwright>=1.45,<2",
    "pytest-playwright>=0.5,<1",
]

[project.scripts]
forge = "skill_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not manual'"
markers = [
    "manual: tests requiring real subprocesses or browsers, excluded from default CI",
]
